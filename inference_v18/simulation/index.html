<!doctype html><meta charset="utf-8"><title>V18 simulation only</title><style>body{font:18px sans-serif;max-width:1000px;margin:30px auto;background:#17202a;color:white}input{width:80px}img{max-width:100%}pre{white-space:pre-wrap}</style><h1>V18 · 仿真控制台</h1><p>仅仿真，无实机接口。位置为模型 TCP，单位 m；XYZ 欧拉角单位 °。</p><form id="f">X <input id="x" value=".8"> Y <input id="y" value="0"> Z <input id="z" value=".7"> Roll <input id="r" value="0"> Pitch <input id="p" value="0"> Yaw <input id="a" value="0"><button>设置目标</button></form><button id="reset">重置</button><p id="err"></p><img id="frame"><pre id="state"></pre><script>async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text())}f.onsubmit=async e=>{e.preventDefault();try{await post('/target',{xyz:['x','y','z'].map(k=>Number(document.getElementById(k).value)),rpy:['r','p','a'].map(k=>Number(document.getElementById(k).value))})}catch(e){err.textContent=e}};reset.onclick=()=>post('/reset',{});setInterval(async()=>{try{state.textContent=JSON.stringify(await(await fetch('/status')).json(),null,2);frame.src='/frame?t='+Date.now()}catch(e){err.textContent=e}},500)</script>
